# Reusable deploy template. Mirrors the shape of template-release-databricks.yml:
# - "prepare" uses an environment only for variables. Its job name does not match
#   the convention, so Meridian ignores the deployment it creates.
# - "deploy" is named "<asset> <version> → <environment>". Meridian reads this name.
name: POC deploy template

on:
  workflow_call:
    inputs:
      asset:
        type: string
        required: true
      version:
        type: string
        required: true
      environment-name:
        type: string
        required: true
      fail:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare ${{ inputs.asset }} ${{ inputs.version }}
    environment: poc-prep
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        env:
          ASSET: ${{ inputs.asset }}
          VERSION: ${{ inputs.version }}
        run: echo "prepare $ASSET $VERSION"

  deploy:
    name: ${{ inputs.asset }} ${{ inputs.version }} → ${{ inputs.environment-name }}
    needs: prepare
    environment: ${{ inputs.environment-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          ASSET: ${{ inputs.asset }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.environment-name }}
        run: |
          echo "deploy $ASSET $VERSION to $TARGET"
          sleep 10
      - name: Fail on purpose
        if: ${{ inputs.fail }}
        run: |
          echo "fail was set to true"
          exit 1
